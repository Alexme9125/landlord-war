name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} · tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  container-browser:
    name: Docker · PVE, PVP and browsers
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GAME_URL: http://127.0.0.1:3001
      SCREENSHOT_DIR: /tmp/landlord-screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Build production container
        run: docker build --tag darwin-landlord:ci .
      - name: Start production container with a fresh data volume
        run: |
          docker run --detach --name darwin-ci \
            --publish 127.0.0.1:3001:3001 \
            --env ORIGIN="$GAME_URL" --env COOKIE_SECURE=false \
            --mount type=volume,source=darwin-ci-data,target=/app/data \
            darwin-landlord:ci
          test "$(docker inspect --format '{{.Config.User}}' darwin-ci)" = node
          for attempt in {1..30}; do
            if curl --fail --silent "$GAME_URL/api/health"; then exit 0; fi
            sleep 1
          done
          docker logs darwin-ci
          exit 1
      - name: Nickname editing, synchronization and persistence
        run: python tests/browser_nickname.py
      - name: Complete PVE and responsive layout
        run: python tests/browser_smoke.py
      - name: Complete PVP with three players and a spectator
        run: python tests/browser_pvp.py
      - name: Chromium, WebKit and Firefox interaction checks
        run: python tests/browser_engines.py
      - name: Collect container log
        if: always()
        run: |
          mkdir -p test-results
          docker logs darwin-ci > test-results/container.log 2>&1 || true
      - name: Upload browser screenshots and container log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-acceptance
          path: |
            /tmp/landlord-screenshots
            test-results/container.log
          retention-days: 7
      - name: Stop test container
        if: always()
        run: docker rm --force darwin-ci || true
